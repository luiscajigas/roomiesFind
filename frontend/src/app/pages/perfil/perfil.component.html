<main class="pagina">
  <app-header></app-header>

  <section class="encabezado-pagina">
    <h1>Mi perfil</h1>
    <p>Entre más claro seas, mejores coincidencias vas a encontrar.</p>
  </section>

  <div class="cargando" *ngIf="cargando" role="status">
    <span class="giro" aria-hidden="true"></span>
    <p>Cargando tu perfil...</p>
  </div>

  <form class="perfil" *ngIf="!cargando && formulario" (ngSubmit)="guardar()">
    <aside class="perfil__foto">
      <app-avatar tamano="l" [nombre]="nombre" [foto]="fotoSrc" [alt]="'Foto de ' + nombre"></app-avatar>
      <h2>{{ nombre }}</h2>
      <p>{{ perfil?.zona }}</p>
      <input id="profile-photo" class="oculto-visual" type="file"
        accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif"
        [disabled]="fotoSubiendo" (change)="actualizarFoto($event)" />
      <label class="btn btn--secundario" for="profile-photo">{{ fotoSubiendo ? 'Guardando...' : 'Cambiar foto' }}</label>
      <small>JPG, PNG, WEBP o GIF, hasta 5 MB.</small>
    </aside>

    <div class="perfil__campos">
      <section class="grupo">
        <h2>Qué estás buscando</h2>
        <div class="grupo__rejilla">
          <div class="campo">
            <label for="presupuesto">Presupuesto mensual (COP)</label>
            <input id="presupuesto" type="number" name="presupuesto" min="0" step="10000" required [(ngModel)]="formulario.presupuesto" />
          </div>
          <div class="campo">
            <label for="zona">Barrio en Pasto</label>
            <app-selector-barrio idCampo="zona" [(valor)]="formulario.zona" [zonaActual]="zonaAnterior"></app-selector-barrio>
          </div>
        </div>
      </section>

      <section class="grupo">
        <h2>Cómo vives</h2>
        <div class="grupo__rejilla">
          <div class="campo">
            <label for="horario">Horario</label>
            <select id="horario" name="horario" [(ngModel)]="formulario.horario">
              <option value="madrugador">Madrugador</option>
              <option value="nocturno">Nocturno</option>
              <option value="mixto">Mixto</option>
            </select>
          </div>
          <div class="campo">
            <label for="visitas">Visitas en casa</label>
            <select id="visitas" name="frecuencia_visitas" [(ngModel)]="formulario.frecuencia_visitas">
              <option value="nunca">Nunca</option>
              <option value="ocasional">Ocasional</option>
              <option value="frecuente">Frecuente</option>
            </select>
          </div>
          <app-escala nombre="limpieza" etiqueta="Orden en casa" minimo="Relajado" maximo="Muy ordenado" [(valor)]="formulario.limpieza"></app-escala>
          <app-escala nombre="tolerancia_ruido" etiqueta="Ruido" minimo="Necesito silencio" maximo="No me molesta" [(valor)]="formulario.tolerancia_ruido"></app-escala>
        </div>
        <div class="grupo__casillas">
          <label class="casilla"><input type="checkbox" name="tiene_mascotas" [(ngModel)]="formulario.tiene_mascotas" /> Tengo mascotas</label>
          <label class="casilla"><input type="checkbox" name="acepta_mascotas" [(ngModel)]="formulario.acepta_mascotas" /> Acepto vivir con mascotas</label>
        </div>
      </section>

      <section class="grupo">
        <h2>Sobre ti</h2>
        <div class="campo">
          <label for="descripcion">Unas líneas para quien te lea</label>
          <textarea id="descripcion" name="descripcion" rows="4" maxlength="1000"
            placeholder="Qué haces, qué te gusta y cómo imaginas la casa."
            [(ngModel)]="formulario.descripcion"></textarea>
        </div>
      </section>

      <p class="aviso aviso--error" *ngIf="error" role="alert">{{ error }}</p>
      <p class="aviso aviso--exito" *ngIf="exito" role="status">{{ exito }}</p>

      <div class="perfil__acciones">
        <button class="btn btn--primario" type="submit" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
        </button>
        <a class="btn btn--secundario" routerLink="/dashboard">Cancelar</a>
      </div>
    </div>
  </form>

  <p class="aviso aviso--error" *ngIf="!cargando && !formulario && error" role="alert">{{ error }}</p>
</main>
