<main class="auth">
  <div class="auth__card">
    <h1>Roomies</h1>
    <p class="subtitulo">Encuentra un compañero de vivienda compatible contigo.</p>

    <label for="email">Correo</label>
    <input id="email" type="email" [(ngModel)]="email" placeholder="tucorreo@demo.com" />

    <label for="password">Contraseña</label>
    <input id="password" type="password" [(ngModel)]="password" placeholder="••••••••" />

    <p class="error" *ngIf="error">{{ error }}</p>

    <button (click)="ingresar()" [disabled]="cargando || !email || !password">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="link-registro">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>

    <div class="demo">
      <p>Demo rápida para el profesor (contraseña <code>demo123</code>):</p>
      <div class="demo__botones">
        <button class="secundario" (click)="usarDemo('luis@demo.com')">Entrar como Luis</button>
        <button class="secundario" (click)="usarDemo('camila@demo.com')">Entrar como Camila</button>
      </div>
    </div>
  </div>
</main>
