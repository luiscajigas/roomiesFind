<header class="topbar">
  <a class="brand" routerLink="/dashboard" aria-label="RoomiesFind, inicio">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="m3.5 10 8.5-7 8.5 7v10.5h-17V10Z" />
        <path d="M9 20.5v-7h6v7M2 10.5l10-8 10 8" />
      </svg>
    </span>
    <span>RoomiesFind<span class="brand__dot">.</span></span>
  </a>
  <div class="topbar__user" *ngIf="usuario" #menuContainer>
    <span class="topbar__greeting">Hola, {{ usuario.nombre }}</span>
    <button #menuToggle class="menu-toggle" type="button" (click)="toggleMenu()"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú de opciones' : 'Abrir menú de opciones'"
      aria-controls="account-menu" [attr.aria-expanded]="menuAbierto" (keydown.escape)="cerrarMenu()">
      <span></span><span></span><span></span>
    </button>
    <nav id="account-menu" class="account-menu" *ngIf="menuAbierto" aria-label="Menú de opciones">
      <div class="account-menu__user">
        <span class="account-menu__avatar">{{ iniciales(usuario.nombre) }}</span>
        <span class="account-menu__identity">
          <strong>{{ usuario.nombre }}</strong>
          <small>{{ usuario.email }}</small>
        </span>
      </div>
      <span class="account-menu__divider"></span>
      <a routerLink="/perfil" routerLinkActive="account-menu__link--active" (click)="cerrarMenu()">
        <span class="account-menu__icon" aria-hidden="true">◎</span>
        Mi perfil
        <span class="account-menu__arrow" aria-hidden="true">→</span>
      </a>
      <a routerLink="/companeros" routerLinkActive="account-menu__link--active" (click)="cerrarMenu()">
        <span class="account-menu__icon" aria-hidden="true">⌕</span>
        Descubrir compañeros
        <span class="account-menu__arrow" aria-hidden="true">→</span>
      </a>
      <button class="account-menu__theme" type="button" (click)="alternarTema()"
        [attr.aria-pressed]="modoClaro">
        <span class="account-menu__icon" aria-hidden="true">{{ modoClaro ? '☾' : '☀' }}</span>
        {{ modoClaro ? 'Activar modo oscuro' : 'Activar modo claro' }}
        <span class="account-menu__arrow">{{ modoClaro ? 'Oscuro' : 'Claro' }}</span>
      </button>
      <span class="account-menu__divider"></span>
      <button class="account-menu__logout" type="button" (click)="salir()">Cerrar sesión</button>
    </nav>
  </div>
</header>
