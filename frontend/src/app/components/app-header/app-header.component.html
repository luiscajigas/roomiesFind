<header class="topbar">
  <a class="brand" routerLink="/dashboard" aria-label="RoomiesFind, inicio">
    <img src="/logo.svg" alt="" />
    <span>RoomiesFind</span>
  </a>
  <nav class="primary-nav" aria-label="Navegación principal">
    <a routerLink="/dashboard" routerLinkActive="primary-nav__link--active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/companeros" routerLinkActive="primary-nav__link--active">Compañeros</a>
    <a routerLink="/perfil" routerLinkActive="primary-nav__link--active">Mi perfil</a>
  </nav>
  <div class="topbar__user" *ngIf="usuario" #menuContainer>
    <button #menuToggle class="menu-toggle" type="button" (click)="toggleMenu()"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú de opciones' : 'Abrir menú de opciones'"
      aria-controls="account-menu" [attr.aria-expanded]="menuAbierto" (keydown.escape)="cerrarMenu()">
      <span class="menu-toggle__lineas" aria-hidden="true"><span></span><span></span><span></span></span>
      <app-avatar tamano="s" [nombre]="usuario.nombre" [foto]="foto$ | async"></app-avatar>
    </button>
    <nav id="account-menu" class="account-menu" *ngIf="menuAbierto" aria-label="Menú de opciones">
      <div class="account-menu__user">
        <app-avatar [nombre]="usuario.nombre" [foto]="foto$ | async"></app-avatar>
        <span class="account-menu__identity">
          <strong>{{ usuario.nombre }}</strong>
          <small>{{ usuario.email }}</small>
        </span>
      </div>
      <a class="account-menu__solo-movil" routerLink="/dashboard" (click)="cerrarMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10" /></svg>
        Inicio
      </a>
      <a routerLink="/perfil" (click)="cerrarMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" /></svg>
        Mi perfil
      </a>
      <a routerLink="/companeros" (click)="cerrarMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        Descubrir compañeros
      </a>
      <button class="account-menu__theme" type="button" (click)="alternarTema()" [attr.aria-pressed]="modoClaro">
        <svg *ngIf="!modoClaro" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        <svg *ngIf="modoClaro" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
        {{ modoClaro ? 'Activar modo oscuro' : 'Activar modo claro' }}
      </button>
      <span class="account-menu__divider"></span>
      <button class="account-menu__logout" type="button" (click)="salir()">Cerrar sesión</button>
    </nav>
  </div>
</header>
